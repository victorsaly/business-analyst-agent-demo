<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Business Performance Analyst Agent: pitch</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { display: block; font-size: 21px; }
  .stage { position: fixed; inset: 0; overflow: hidden; background-color: var(--paper); }
  iframe.app { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; background: var(--paper);
               transform-origin: 0 0; transition: transform 700ms var(--ease); }
  .card { position: absolute; inset: 0; display: grid; grid-template-columns: 9rem 1fr; background-color: var(--paper);
          background-image: linear-gradient(to bottom, transparent calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px), var(--rule) var(--line), transparent var(--line));
          background-size: 100% var(--line); }
  .card .sp { border-right: 3px solid var(--ink); display: flex; flex-direction: column; align-items: center; padding-top: 2.4rem; gap: 1.2rem; }
  .card .sp i { display: block; width: 5rem; height: 8px; background: var(--red); }
  .card .body { align-self: center; padding: 0 7rem; }
  .card h1 { font-size: 7.4rem; line-height: 1.02; margin: 0; }
  .card h1 .w { display: inline-block; clip-path: inset(0 100% 0 0); animation: inkword 420ms var(--ease) forwards; }
  .card .under { height: 8px; background: var(--ink); width: 0; margin-top: 2.2rem; animation: under 700ms var(--ease) forwards; }
  .card p.sub { font-family: var(--hand-sc); font-size: 3rem; margin: 2rem 0 0; opacity: 0; animation: fadeup 500ms var(--ease) forwards; -webkit-text-stroke: 0.02em currentColor; }
  .card p.sub b { color: var(--red-ink); font-weight: 400; }
  @keyframes inkword { to { clip-path: inset(0 0 0 0); } }
  @keyframes under { to { width: 62%; } }
  @keyframes fadeup { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .wipe { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; background: var(--ink); transform: translateX(-102%); z-index: 20; }
  .wipe::after { content: ""; position: absolute; top: 0; bottom: 0; right: -18px; width: 18px; background: var(--red); }
  .wipe.go { animation: wipe 560ms cubic-bezier(0.7, 0, 0.3, 1) forwards; }
  @keyframes wipe { 0% { transform: translateX(-102%); } 45%, 55% { transform: translateX(0); } 100% { transform: translateX(104%); } }
  .lower { position: absolute; left: 7rem; bottom: 4.5rem; z-index: 10; background: var(--paper); border: 3px solid var(--ink);
           padding: 1rem 1.8rem 0.9rem; font-family: var(--hand-sc); font-size: 3.1rem; line-height: 1.1; max-width: 70%;
           box-shadow: 0 18px 40px -18px rgba(30, 58, 138, 0.45); opacity: 0; transform: translateY(30px);
           transition: opacity 360ms var(--ease), transform 460ms var(--ease); -webkit-text-stroke: 0.025em currentColor; }
  .lower.on { opacity: 1; transform: none; }
  .tag-real { position: absolute; right: 2.4rem; bottom: 2rem; z-index: 10; font-family: var(--typed); font-size: 1.1rem;
              background: var(--paper); border: 1.5px solid var(--ink); padding: 0.35rem 0.7rem; opacity: 0; transition: opacity 300ms; }
  .tag-real.on { opacity: 1; }
  .tag-real.dry { color: var(--red-ink); border-color: var(--red); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="wipe" id="wipe"></div>
<div class="lower" id="lower"></div>
<div class="tag-real" id="tagreal"></div>
<script>
/* The recorder calls play(timeline). Each scene: {start, dur, kind: "card"|"app", ...}.
   card: {lines: [...], sub}; app: {url, actions: [{t, zoom|zoomOut|scroll}], caption, captionAt} */
const stage = document.getElementById("stage");
const wipe = document.getElementById("wipe");
const lower = document.getElementById("lower");
const tagreal = document.getElementById("tagreal");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

function cardHTML(sc, beat) {
  let k = 0;
  const lines = sc.lines.map((line) => line.split(" ").map((w) => `<span class="w" style="animation-delay:${(k++) * beat * 0.5}ms">${esc(w)}</span>`).join(" ")).join("<br>");
  const delay = k * beat * 0.5 + 150;
  return `<div class="card"><div class="sp"><i></i><i></i><i></i></div><div class="body"><h1>${lines}</h1>
    <div class="under" style="animation-delay:${delay}ms"></div>${sc.sub ? `<p class="sub" style="animation-delay:${delay + 300}ms">${sc.sub}</p>` : ""}</div></div>`;
}

async function runApp(sc, t0) {
  const f = document.createElement("iframe");
  f.className = "app";
  f.src = sc.url;
  stage.replaceChildren(f);
  tagreal.textContent = sc.tag || "";
  tagreal.className = "tag-real on" + (sc.dry ? " dry" : "");
  for (const a of sc.actions || []) {
    const at = t0 + (sc.start + a.t) * 1000 - performance.now();
    if (at > 0) await wait(at);
    const w = f.contentWindow;
    if (!w) continue;
    try {
      if (a.zoom) {   // the answer streams in: wait (up to 3s) for the thing to zoom into
        for (let k = 0; k < 20 && !(w.document && w.document.querySelector(a.zoom) && w.__zoom); k++) await wait(150);
        w.__zoom && w.__zoom(a.zoom);
      }
      if (a.zoomOut) w.__zoomOut && w.__zoomOut();
      if (a.scroll) { const el = w.document.querySelector(a.scroll); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
    } catch (e) { /* the frame is still loading */ }
  }
}

async function play(timeline) {
  const beat = 60000 / (timeline.bpm || 120);
  const t0 = performance.now();
  window.__t0 = Date.now();
  for (let i = 0; i < timeline.scenes.length; i++) {
    const sc = timeline.scenes[i];
    const startAt = t0 + sc.start * 1000;
    if (i > 0) {   // the tape wipe covers the cut, centred on the scene boundary
      const pre = startAt - 280 - performance.now();
      if (pre > 0) await wait(pre);
      wipe.classList.remove("go"); void wipe.offsetWidth; wipe.classList.add("go");
      await wait(Math.max(0, startAt - performance.now()));
    } else {
      await wait(Math.max(0, startAt - performance.now()));
    }
    lower.classList.remove("on");
    if (sc.kind === "card") {
      tagreal.className = "tag-real";
      stage.innerHTML = cardHTML(sc, beat);
    } else {
      runApp(sc, t0);
    }
    if (sc.caption) {
      setTimeout(() => { lower.innerHTML = sc.caption; lower.classList.add("on"); }, (sc.captionAt ?? 1.2) * 1000);
    }
  }
  const end = timeline.scenes.at(-1);
  await wait(Math.max(0, t0 + (end.start + end.dur) * 1000 - performance.now()));
  document.body.dataset.done = "1";
  return Date.now() - window.__t0;
}
window.play = play;
</script>
</body>
</html>
